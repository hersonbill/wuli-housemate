<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#245c46">
  <title>屋里｜合租生活管家</title>
  <meta name="description" content="费用、值日、公共物品和室友公约，一起把合租生活过清楚。">
  <link rel="stylesheet" href="./design.css?v=2">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">屋</span><div><strong>屋里</strong><small>合租生活管家</small></div></div>
      <div class="house-label"><span>我们的共享空间</span><b>春和里 · 6 栋</b><small>四个人，一个刚刚好的家。</small></div>
      <nav id="nav" aria-label="主要导航"></nav>
      <div class="sidebar-postcard"><span>生活里的小默契</span><p>住在一起，<br>日子也有了温度。</p><i>make room for each other.</i></div>
      <div class="side-note"><span class="pulse"></span><div><b>演示模式</b><small>数据仅保存在当前浏览器</small></div></div>
    </aside>
    <main>
      <header class="topbar">
        <button class="mobile-brand" data-page="home" aria-label="回到首页"><span>屋</span>屋里</button>
        <div class="breadcrumb">我们的屋里 <span>/</span> <b id="current-page-name">生活总览</b></div>
        <div class="top-spacer"></div>
        <label class="person-switch">正在以 <select id="current-user" aria-label="切换演示室友"></select> 身份体验</label>
        <button id="reset-btn" class="text-btn">重置演示</button>
      </header>
      <section id="content" class="content" aria-live="polite"></section>
      <footer class="site-footer"><span>屋里 WULI · 把小事理清，把日子过好。</span><span>演示空间 · 数据仅保存在当前浏览器</span></footer>
    </main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="手机导航"></nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status"></div>
  <script src="./art.js?v=2"></script>
  <script src="./views.js?v=2"></script>
  <script src="./app.js?v=2"></script>
</body>
</html>
